<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <style>
    body { margin: 0; padding: 20px; background-color: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; padding: 20px; max-width: 600px; margin: 0 auto; }
    h2 { color: #5865F2; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="file"], input[type="range"] { width: 100%; box-sizing: border-box; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎨 إعدادات الترحيب والأفاتار</h2>
    <form action="/update-welcome" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label>📁 رفع صورة خلفية جديدة:</label>
        <input type="file" name="bgImage" accept="image/*">
      </div>
      <div class="form-group">
        <label>↔️ موقع الأفاتار X:</label>
        <input type="range" name="avatarX" min="0" max="800" value="400">
      </div>
      <div class="form-group">
        <label>↕️ موقع الأفاتار Y:</label>
        <input type="range" name="avatarY" min="0" max="360" value="120">
      </div>
      <div class="form-group">
        <label>🔍 حجم الأفاتار:</label>
        <input type="range" name="avatarRadius" min="20" max="150" value="60">
      </div>
      <button type="submit" class="btn">حفظ الإعدادات</button>
    </form>
  </div>
</body>
</html>
