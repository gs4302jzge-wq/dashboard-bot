<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCORP RP - Commands Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --bg-dark: #090c15;
      --card-bg: rgba(15, 22, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .ticker-bar {
      background: rgba(13, 17, 30, 0.9);
      text-align: center;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header {
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    .layout { display: flex; flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; }

    .sidebar {
      width: 260px;
      background: rgba(11, 15, 25, 0.5);
      border-left: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 11px 16px; color: #94a3b8; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
    }
    .nav-link.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #ffffff; box-shadow: 0 6px 18px -3px var(--primary-glow);
    }

    .main-content { flex: 1; padding: 20px; display: flex; justify-content: center; }
    .tab-content { display: none; width: 100%; max-width: 760px; }
    .tab-content.active { display: block; }

    .stats-banner {
      background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); color: #818cf8; padding: 14px 20px; border-radius: 16px; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }

    .cmd-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 16px; backdrop-filter: blur(20px);
    }
    .cmd-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cmd-title-group { display: flex; align-items: center; gap: 12px; }
    .cmd-icon-box { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
    .cmd-name { font-size: 18px; font-weight: 800; color: #f8fafc; }

    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 30px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(22px); }

    .cmd-details { display: flex; flex-direction: column; gap: 6px; font-size: 13px; margin-bottom: 16px; }
    .detail-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .detail-label { color: var(--text-muted); font-weight: 700; }
    .detail-val { color: #e2e8f0; font-weight: 600; }
    .usage-badge { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 4px 10px; border-radius: 8px; font-family: monospace; font-weight: 700; font-size: 12px; }
    .alias-badge { color: #38bdf8; font-weight: 700; background: rgba(56, 189, 248, 0.1); padding: 2px 8px; border-radius: 6px; font-size: 12px; margin-left: 4px; }

    .cmd-actions { display: flex; gap: 10px; }
    .btn-action { padding: 8px 18px; border-radius: 10px; border: none; font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-edit { background: #2563eb; color: #ffffff; }
    .btn-edit:hover { background: #1d4ed8; }
    .btn-remove { background: #dc2626; color: #ffffff; }
    .btn-remove:hover { background: #b91c1c; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; width: 92%; max-width: 480px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    
    .alias-bars-container { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; margin-bottom: 14px; padding-left: 4px; }
    .alias-input-row { display: flex; align-items: center; gap: 8px; }
    .alias-input { flex: 1; background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
    .alias-input:focus { border-color: #6366f1; }
    .btn-del-bar { background: rgba(220, 38, 38, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .btn-del-bar:hover { background: #dc2626; color: #fff; }

    .btn-add-bar { background: rgba(99, 102, 241, 0.15); border: 1px dashed #6366f1; color: #818cf8; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; margin-bottom: 20px; transition: 0.2s; }
    .btn-add-bar:hover { background: rgba(99, 102, 241, 0.25); color: #fff; }

    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-modal-cancel { background: #334155; color: #fff; padding: 9px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
    .btn-modal-save { background: #6366f1; color: #fff; padding: 9px 22px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }

    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; padding: 8px; }
      .nav-link { white-space: nowrap; padding: 8px 12px; font-size: 12px; }
      .main-content { padding: 12px; }
    }
  </style>
</head>
<body>

  <div class="ticker-bar">
    <i class="fa-solid fa-sparkles"></i>
    <span>✨ سبحان الله وبحمده ، سبحان الله العظيم ✨</span>
  </div>

  <header class="header">
    <div class="brand"><i class="fa-solid fa-shield-cat"></i> OSCORP RP</div>
    <div class="user-profile"><i class="fa-solid fa-user"></i> <span>nfyp_ Admin</span></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="nav-link" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Dashboard</div>
      <div class="nav-link" onclick="switchTab('welcome', this)"><i class="fa-solid fa-address-card"></i> Welcome System</div>
      <div class="nav-link active" onclick="switchTab('commands', this)"><i class="fa-solid fa-cubes-stacked"></i> Commands & Aliases</div>
      <div class="nav-link" onclick="switchTab('guild', this)"><i class="fa-solid fa-server"></i> Guild Support</div>
      <div class="nav-link" onclick="switchTab('settings', this)"><i class="fa-solid fa-sliders"></i> Settings</div>
    </aside>

    <main class="main-content">
      <div id="tab-commands" class="tab-content active">
        
        <div class="stats-banner">
          <span><i class="fa-solid fa-terminal"></i> قائمة أوامر البوت المتاحة (Bot Commands & Aliases)</span>
          <span style="font-size: 12px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; color: #fff;" id="cmdCount">Active Commands 24</span>
        </div>

        <div id="commandsList"></div>

      </div>
    </main>
  </div>

  <!-- Custom Alias Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title">
        <span><i class="fa-solid fa-sliders" style="color:#6366f1;"></i> تعديل اختصارات (<span id="modalCmdName">Ban</span>)</span>
        <span style="font-size: 12px; color: #94a3b8;" id="barCounter">(0/5)</span>
      </div>

      <div class="alias-bars-container" id="barsContainer"></div>

      <button class="btn-add-bar" id="btnAddBar" onclick="addAliasBar()"><i class="fa-solid fa-plus"></i> إضافة اختصار جديد</button>

      <div class="modal-btns">
        <button class="btn-modal-cancel" onclick="closeCustomModal()">إلغاء</button>
        <button class="btn-modal-save" onclick="saveCustomModal()">حفظ التغيرات</button>
      </div>
    </div>
  </div>

  <script>
    // 24 أمراً كاملاً ومفصلاً
    let commandsData = [
      { id: 'ban', name: 'Ban', icon: 'fa-hammer', color: 'linear-gradient(135deg, #ef4444, #991b1b)', dev: 'Mohammed Alhajri', desc: 'Bans a user permanently from the server.', usage: '-ban {@user} [reason]', aliases: ['م', 'حظر'] },
      { id: 'kick', name: 'Kick', icon: 'fa-user-slash', color: 'linear-gradient(135deg, #f59e0b, #b45309)', dev: 'Mohammed Alhajri', desc: 'Kicks a user from the server.', usage: '-kick {@user} [reason]', aliases: ['طرد'] },
      { id: 'clear', name: 'Clear', icon: 'fa-broom', color: 'linear-gradient(135deg, #10b981, #047857)', dev: 'Mohammed Alhajri', desc: 'Clears messages from a channel.', usage: '-clear {amount}', aliases: ['مسح', 'purge'] },
      { id: 'mute', name: 'Mute', icon: 'fa-volume-xmark', color: 'linear-gradient(135deg, #6366f1, #4338ca)', dev: 'Mohammed Alhajri', desc: 'Mutes a member in the server.', usage: '-mute {@user} [time]', aliases: ['اسكات', 'ميوت'] },
      { id: 'unmute', name: 'Unmute', icon: 'fa-volume-high', color: 'linear-gradient(135deg, #3b82f6, #1d4ed8)', dev: 'Mohammed Alhajri', desc: 'Unmutes a muted member.', usage: '-unmute {@user}', aliases: ['فك_الميوت'] },
      { id: 'ticket', name: 'Ticket', icon: 'fa-ticket', color: 'linear-gradient(135deg, #8b5cf6, #6d28d9)', dev: 'Mohammed Alhajri', desc: 'Opens a support ticket.', usage: '-ticket', aliases: ['تذكرة', 'الدعم'] },
      { id: 'ping', name: 'Ping', icon: 'fa-wifi', color: 'linear-gradient(135deg, #06b6d4, #0e7490)', dev: 'Mohammed Alhajri', desc: 'Checks bot latency.', usage: '-ping', aliases: ['بنج', 'سرعة'] },
      { id: 'warn', name: 'Warn', icon: 'fa-triangle-exclamation', color: 'linear-gradient(135deg, #eab308, #a16207)', dev: 'Mohammed Alhajri', desc: 'Issues a warning to a member.', usage: '-warn {@user} [reason]', aliases: ['إنذار', 'تحذير'] },
      { id: 'unban', name: 'Unban', icon: 'fa-unlock', color: 'linear-gradient(135deg, #22c55e, #15803d)', dev: 'Mohammed Alhajri', desc: 'Unbans a user using ID.', usage: '-unban {id}', aliases: ['فك_الحظر'] },
      { id: 'lock', name: 'Lock', icon: 'fa-lock', color: 'linear-gradient(135deg, #64748b, #334155)', dev: 'Mohammed Alhajri', desc: 'Locks current text channel.', usage: '-lock', aliases: ['قفل'] },
      { id: 'unlock', name: 'Unlock', icon: 'fa-lock-open', color: 'linear-gradient(135deg, #38bdf8, #0284c7)', dev: 'Mohammed Alhajri', desc: 'Unlocks current text channel.', usage: '-unlock', aliases: ['فتح'] },
      { id: 'user', name: 'User Info', icon: 'fa-user-gear', color: 'linear-gradient(135deg, #ec4899, #be185d)', dev: 'Mohammed Alhajri', desc: 'Displays detailed user information.', usage: '-user [@user]', aliases: ['يوزر', 'معلومات'] },
      { id: 'server', name: 'Server Info', icon: 'fa-server', color: 'linear-gradient(135deg, #a855f7, #7e22ce)', dev: 'Mohammed Alhajri', desc: 'Displays server status and stats.', usage: '-server', aliases: ['سيرفر'] },
      { id: 'botinfo', name: 'Bot Info', icon: 'fa-robot', color: 'linear-gradient(135deg, #06b6d4, #0891b2)', dev: 'Mohammed Alhajri', desc: 'Displays system specifications.', usage: '-botinfo', aliases: ['البوت'] },
      { id: 'role', name: 'Role Manage', icon: 'fa-user-shield', color: 'linear-gradient(135deg, #f43f5e, #be123c)', dev: 'Mohammed Alhajri', desc: 'Gives or removes role from user.', usage: '-role {@user} {role}', aliases: ['رتبة'] },
      { id: 'avatar', name: 'Avatar', icon: 'fa-image', color: 'linear-gradient(135deg, #14b8a6, #0f766e)', dev: 'Mohammed Alhajri', desc: 'Fetches profile avatar.', usage: '-avatar [@user]', aliases: ['افتار', 'صورة'] },
      { id: 'say', name: 'Say', icon: 'fa-comment-dots', color: 'linear-gradient(135deg, #6366f1, #4f46e5)', dev: 'Mohammed Alhajri', desc: 'Bot repeats text in embed.', usage: '-say {text}', aliases: ['قول'] },
      { id: 'slowmode', name: 'Slowmode', icon: 'fa-gauge-high', color: 'linear-gradient(135deg, #f97316, #c2410c)', dev: 'Mohammed Alhajri', desc: 'Sets channel message cooldown.', usage: '-slowmode {time}', aliases: ['بطء'] },
      { id: 'embed', name: 'Embed Creator', icon: 'fa-file-lines', color: 'linear-gradient(135deg, #8b5cf6, #5b21b6)', dev: 'Mohammed Alhajri', desc: 'Generates customized embed message.', usage: '-embed {json/text}', aliases: ['امبد'] },
      { id: 'poll', name: 'Poll System', icon: 'fa-square-poll-vertical', color: 'linear-gradient(135deg, #10b981, #065f46)', dev: 'Mohammed Alhajri', desc: 'Creates voting poll in channel.', usage: '-poll {question}', aliases: ['تصويت'] },
      { id: 'jail', name: 'Jail', icon: 'fa-bars-staggered', color: 'linear-gradient(135deg, #475569, #1e293b)', dev: 'Mohammed Alhajri', desc: 'Jails member in RP prison.', usage: '-jail {@user} [time]', aliases: ['سجن'] },
      { id: 'unjail', name: 'Unjail', icon: 'fa-key', color: 'linear-gradient(135deg, #22c55e, #166534)', dev: 'Mohammed Alhajri', desc: 'Releases member from jail.', usage: '-unjail {@user}', aliases: ['إفراج'] },
      { id: 'revive', name: 'Revive RP', icon: 'fa-heart-pulse', color: 'linear-gradient(135deg, #ef4444, #b91c1c)', dev: 'Mohammed Alhajri', desc: 'Sends RP server revival notice.', usage: '-revive', aliases: ['إحياء'] },
      { id: 'setup', name: 'System Setup', icon: 'fa-gears', color: 'linear-gradient(135deg, #3b82f6, #1e40af)', dev: 'Mohammed Alhajri', desc: 'Configures bot modules.', usage: '-setup', aliases: ['تثبيت'] }
    ];

    let currentCmdId = '';

    function renderCommands() {
      const list = document.getElementById('commandsList');
      list.innerHTML = '';
      commandsData.forEach(cmd => {
        const aliasesHtml = cmd.aliases.map(a => `<span class="alias-badge">${a}</span>`).join(' ');
        list.innerHTML += `
          <div class="cmd-card" id="card-${cmd.id}">
            <div class="cmd-header">
              <div class="cmd-title-group">
                <div class="cmd-icon-box" style="background: ${cmd.color};"><i class="fa-solid ${cmd.icon}"></i></div>
                <div class="cmd-name">${cmd.name}</div>
              </div>
              <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="cmd-details">
              <div class="detail-row"><span class="detail-label">Developer:</span><span class="detail-val">${cmd.dev}</span></div>
              <div class="detail-row"><span class="detail-label">Description:</span><span class="detail-val">${cmd.desc}</span></div>
              <div class="detail-row" style="margin-top:4px;"><span class="detail-label">Usage:</span><span class="usage-badge">${cmd.usage}</span></div>
              <div class="detail-row" style="margin-top:2px;"><span class="detail-label">Aliases:</span> <span id="aliases-list-${cmd.id}">${aliasesHtml || 'لا يوجد'}</span></div>
            </div>
            <div class="cmd-actions">
              <button class="btn-action btn-edit" onclick="openCustomModal('${cmd.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit Aliases</button>
              <button class="btn-action btn-remove" onclick="removeCard('${cmd.id}')"><i class="fa-solid fa-trash-can"></i> Remove</button>
            </div>
          </div>
        `;
      });
      document.getElementById('cmdCount').innerText = `Active Commands ${commandsData.length}`;
    }

    function switchTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      const selectedTab = document.getElementById('tab-' + tabName);
      if (selectedTab) selectedTab.classList.add('active');
      element.classList.add('active');
    }

    function openCustomModal(cmdId) {
      currentCmdId = cmdId;
      const cmd = commandsData.find(c => c.id === cmdId);
      if (!cmd) return;

      document.getElementById('modalCmdName').innerText = cmd.name;
      const container = document.getElementById('barsContainer');
      container.innerHTML = '';

      if (cmd.aliases.length === 0) {
        addAliasBar('');
      } else {
        cmd.aliases.forEach(alias => addAliasBar(alias));
      }

      updateBarState();
      document.getElementById('editModal').classList.add('active');
    }

    function addAliasBar(val = '') {
      const container = document.getElementById('barsContainer');
      if (container.children.length >= 5) return;

      const row = document.createElement('div');
      row.className = 'alias-input-row';
      row.innerHTML = `
        <input type="text" class="alias-input" value="${val}" placeholder="أدخل اختصار">
        <button class="btn-del-bar" onclick="removeBar(this)"><i class="fa-solid fa-xmark"></i></button>
      `;
      container.appendChild(row);
      updateBarState();
    }

    function removeBar(btn) {
      btn.parentElement.remove();
      updateBarState();
    }

    function updateBarState() {
      const container = document.getElementById('barsContainer');
      const count = container.children.length;
      document.getElementById('barCounter').innerText = `(${count}/5)`;
      
      const btnAdd = document.getElementById('btnAddBar');
      if (count >= 5) {
        btnAdd.style.display = 'none';
      } else {
        btnAdd.style.display = 'flex';
      }
    }

    function closeCustomModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function saveCustomModal() {
      const cmd = commandsData.find(c => c.id === currentCmdId);
      if (!cmd) return;

      const inputs = document.querySelectorAll('.alias-input');
      const newAliases = [];
      inputs.forEach(input => {
        const value = input.value.trim();
        if (value !== '' && !newAliases.includes(value)) {
          newAliases.push(value);
        }
      });

      cmd.aliases = newAliases;
      renderCommands();
      closeCustomModal();
    }

    function removeCard(cmdId) {
      commandsData = commandsData.filter(c => c.id !== cmdId);
      renderCommands();
    }

    renderCommands();
  </script>
</body>
</html>
