<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; display: flex; min-height: 100vh; }
    
    /* القائمة الجانبية Sidebar */
    .sidebar { width: 260px; background: #0d1322; border-left: 1px solid rgba(255,255,255,0.06); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar h1 { font-size: 20px; color: #5865F2; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94a3b8; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .nav-item:hover, .nav-item.active { background: #5865F2; color: #fff; }
    
    /* المحتوى الرئيسي Main Content */
    .content { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; padding: 24px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .card h2 { color: #5865F2; margin-bottom: 20px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; font-size: 14px; }
    input[type="file"] { background: #0b0f19; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); width: 100%; color: #888; }
    input[type="range"] { width: 100%; accent-color: #2563eb; cursor: pointer; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <aside class="sidebar">
    <h1>OSCORP RP</h1>
    <a href="#" class="nav-item">📊 Dashboard</a>
    <a href="#" class="nav-item active">👋 Welcome System</a>
    <a href="#" class="nav-item">🧩 Plugins</a>
    <a href="#" class="nav-item">🛡️ Guild Support</a>
    <a href="#" class="nav-item">⚙️ Settings</a>
  </aside>

  <!-- منطقة المحتوى -->
  <main class="content">
    <div class="card">
      <h2>🎨 إعدادات الترحيب والأفاتار</h2>
      <form action="/update-welcome" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label>📁 رفع صورة خلفية جديدة:</label>
          <input type="file" name="bgImage" accept="image/*">
        </div>
        <div class="form-group">
          <label>↔️ موقع الأفاتار X:</label>
          <input type="range" name="avatarX" min="0" max="800" value="400">
        </div>
        <div class="form-group">
          <label>↕️ موقع الأفاتار Y:</label>
          <input type="range" name="avatarY" min="0" max="360" value="120">
        </div>
        <div class="form-group">
          <label>🔍 حجم الأفاتار:</label>
          <input type="range" name="avatarRadius" min="20" max="150" value="60">
        </div>
        <button type="submit" class="btn">حفظ الإعدادات</button>
      </form>
    </div>
  </main>

</body>
</html>
