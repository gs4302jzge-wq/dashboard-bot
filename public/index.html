<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSCORP RP - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body {
      background: radial-gradient(circle at top right, #1a1c2e, #0b0d17);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Header for Mobile & Desktop */
    .header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .layout {
      display: flex;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background: rgba(15, 23, 42, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      transform: translateX(-3px);
    }

    .nav-link.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f8fafc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    /* File Input Styling */
    .file-input-wrapper {
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: border-color 0.3s ease;
      cursor: pointer;
    }

    .file-input-wrapper:hover {
      border-color: #6366f1;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* Custom Range Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.8);
      transition: transform 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Save Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
    }

    /* Responsive adjustments for Mobile */
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-left: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        flex-direction: row;
        overflow-x: auto;
        padding: 12px;
      }
      .nav-link {
        white-space: nowrap;
        padding: 8px 14px;
        font-size: 13px;
      }
      .main-content {
        padding: 15px;
      }
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">OSCORP RP</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <a href="#" class="nav-link">📊 Dashboard</a>
      <a href="#" class="nav-link active">👋 Welcome System</a>
      <a href="#" class="nav-link">🧩 Plugins</a>
      <a href="#" class="nav-link">🛡️ Guild Support</a>
      <a href="#" class="nav-link">⚙️ Settings</a>
    </aside>

    <main class="main-content">
      <div class="card">
        <div class="card-title">
          <span>🎨</span> إعدادات الترحيب والأفاتار
        </div>

        <form action="/update-welcome" method="POST" enctype="multipart/form-data">
          
          <div class="form-group">
            <label>📁 رفع صورة خلفية جديدة:</label>
            <div class="file-input-wrapper">
              <span style="color: #94a3b8; font-size: 14px;">اضغط هنا لاختيار صورة الخلفية</span>
              <input type="file" name="bgImage" accept="image/*">
            </div>
          </div>

          <div class="form-group">
            <label>↔️ موقع الأفاتار (الأفقي X):</label>
            <input type="range" name="avatarX" min="0" max="800" value="400">
          </div>

          <div class="form-group">
            <label>↕️ موقع الأفاتار (العمودي Y):</label>
            <input type="range" name="avatarY" min="0" max="360" value="120">
          </div>

          <div class="form-group">
            <label>🔍 حجم الأفاتار:</label>
            <input type="range" name="avatarRadius" min="20" max="150" value="60">
          </div>

          <button type="submit" class="btn-submit">حفظ الإعدادات</button>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
